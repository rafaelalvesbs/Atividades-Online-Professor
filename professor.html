<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

        body { font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 20px; display: flex; gap: 20px; background-color: #F4F7FB; height: 100vh; box-sizing: border-box; color: #0f172a; }
        
        .col-left { flex: 1.5; background: transparent; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        .col-right { flex: 1; background: transparent; display: flex; flex-direction: column; overflow: hidden; }

        .card-box { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); border: none; }

        h2 { color: #0f172a; font-weight: 800; margin-top: 0; margin-bottom: 20px; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; font-size: 22px; }
        
        .btn-premium { width: 100%; padding: 18px; border: none; border-radius: 16px; font-size: 15px; font-weight: 800; cursor: pointer; transition: all 0.3s; color: white; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-premium:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .btn-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
        .btn-success { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .btn-outline { background: transparent; border: 2px solid #e2e8f0; color: #64748b; }
        .btn-outline:hover { background: #f8fafc; color: #0f172a; transform: none; box-shadow: none; }

        .btn-action { background: #f1f5f9; color: #0f172a; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 13px; padding: 12px 20px; transition: 0.2s; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
        .btn-action:hover { background: #e2e8f0; }

        .input-premium { width: 100%; padding: 16px; border: 2px solid #e2e8f0; border-radius: 14px; font-size: 14px; background: #fff; margin-bottom: 15px; font-family: inherit; font-weight: 600; color: #0f172a; box-sizing: border-box; outline: none; transition: 0.3s; }
        .input-premium:focus { border-color: #8b5cf6; box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1); }

        .stats-container { display: flex; gap: 15px; margin-bottom: 20px; }
        .stat-box { flex: 1; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); text-align: center; display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden; }
        .stat-box::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #6366f1, #a855f7); }
        .stat-box.success::before { background: linear-gradient(90deg, #10b981, #059669); }
        .stat-number { font-size: 38px; font-weight: 800; color: #0f172a; line-height: 1; margin-bottom: 8px; }
        .stat-label { font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }

        .question-form { background: #f8fafc; padding: 25px; margin-bottom: 20px; border-radius: 20px; border: 1px solid #e2e8f0; transition: 0.3s; }
        .question-form:focus-within { border-color: #cbd5e1; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
        
        .ranking-container { flex-grow: 1; overflow-y: auto; padding-right: 5px; }
        .card-premium-list { background: #fff; border-radius: 16px; padding: 15px 20px; margin-bottom: 12px; display: flex; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.02); border: 1px solid #f1f5f9; transition: transform 0.2s; position: relative; overflow: hidden; }
        .card-premium-list::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; }
        .card-premium-list.pending::before { background: #f59e0b; }
        .card-premium-list.success::before { background: #10b981; }
        .card-premium-list:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
        
        .badge { padding: 6px 12px; border-radius: 10px; font-size: 11px; font-weight: 800; display: inline-block; white-space: nowrap; }
        .badge.pending { background: #fef3c7; color: #d97706; }
        .badge.success { background: #d1fae5; color: #059669; }

        /* Modal Styles */
        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); display: none; justify-content: center; align-items: center; z-index: 9999; backdrop-filter: blur(8px); }
        .modal-content { background: #fff; width: 90%; max-width: 650px; border-radius: 24px; padding: 35px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>

    <!-- MODAL IMPORTAÇÃO -->
    <div id="modal-import" class="modal-overlay">
        <div class="modal-content">
            <h3 style="color:#0f172a; margin-top:0; font-weight: 800; font-size: 22px; display: flex; align-items: center; gap: 10px;"><i class="fa-solid fa-wand-magic-sparkles" style="color: #8b5cf6;"></i> Importar com IA</h3>
            <p style="font-size:14px; color:#64748b; margin-bottom: 20px;">Cole o texto gerado pela Inteligência Artificial abaixo (questões, alternativas e correct answer).</p>
            <textarea id="texto-importar" class="input-premium" style="height:250px; resize:none; font-family: monospace; font-size: 13px;" placeholder="Ex: 
1) The cat ___ on the table.
a) is
b) are
c) am
correct answer: a" autocomplete="off"></textarea>
            <div style="display:flex; gap:15px; margin-top:20px;">
                <button class="btn-modern btn-gradient" onclick="processarImportacao()" style="flex: 2;">PROCESSAR E PREENCHER</button>
                <button class="btn-modern btn-outline" onclick="document.getElementById('modal-import').style.display='none'" style="flex: 1;">CANCELAR</button>
            </div>
        </div>
    </div>

    <div class="col-left">
        <!-- ÁREA DE GERAÇÃO E QR CODE -->
        <div class="card-box" style="text-align: center;">
            <button id="btnGerarSessao" class="btn-modern btn-success">
                <i class="fa-solid fa-rocket"></i> PUBLISH SESSION & GET QR CODE
            </button>
            
            <div id="qrCodeDisplay" style="display: none; flex-direction: column; align-items: center; margin-top: 30px;">
                <p style="font-weight: 800; color: #0f172a; margin-bottom: 20px; text-transform: uppercase; font-size: 16px; letter-spacing: 1px;">Ask students to scan:</p>
                <img id="qrImage" src="" alt="QR Code" style="border-radius: 20px; border: 8px solid #fff; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 220px; height: 220px;">
                <p style="font-size: 13px; color: #64748b; font-weight: 800; margin-top: 25px; background: #f1f5f9; padding: 12px 24px; border-radius: 12px; letter-spacing: 0.5px;">ROOM ID: <span id="sessaoIdDisplay" style="color: #8b5cf6;"></span></p>
            </div>
        </div>

        <!-- FORMULÁRIO DE CRIAÇÃO DAS QUESTÕES -->
        <div class="card-box" id="areaCriacaoQuestoes">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <h2><i class="fa-solid fa-layer-group" style="color: #6366f1;"></i> Builder</h2>
            </div>
            
            <!-- Campo de Título e Botões de Ação -->
            <div style="display: flex; gap: 12px; align-items: center; margin-bottom: 30px; background: #f8fafc; padding: 15px; border-radius: 16px;">
                <input type="text" id="titulo-gram" class="input-premium" placeholder="Lesson Topic (e.g. Present Simple)" style="flex: 1; margin-bottom: 0; background: #fff;" autocomplete="off">
                <button class="btn-action" id="btn-prompt-gram" onclick="copiarPrompt(event)" style="background: #e0e7ff; color: #4f46e5;">
                    <i class="fa-solid fa-copy"></i> COPY AI PROMPT
                </button>
                <button class="btn-action" style="background: #dbeafe; color: #4338ca;" onclick="document.getElementById('modal-import').style.display='flex'">
                    <i class="fa-solid fa-file-import"></i> IMPORT TEXT
                </button>
            </div>

            <div id="formQuestoesContainer"></div>
        </div>
    </div>

    <div class="col-right">
        <div class="stats-container">
            <div class="stat-box">
                <div class="stat-number" id="countLogados">0</div>
                <div class="stat-label">Connected</div>
            </div>
            <div class="stat-box success">
                <div class="stat-number" id="countEntregues">0</div>
                <div class="stat-label">Submitted</div>
            </div>
        </div>
        
        <div class="card-box" style="flex-grow: 1; display: flex; flex-direction: column; padding: 25px 20px;">
            <h2 style="font-size: 18px; margin-bottom: 20px;"><i class="fa-solid fa-trophy" style="color: #f59e0b;"></i> Live Leaderboard</h2>
            <div class="ranking-container" id="rankingList">
                <div style="text-align: center; color: #94a3b8; margin-top: 50px;">
                    <i class="fa-solid fa-satellite-dish" style="font-size: 40px; margin-bottom: 15px; opacity: 0.5;"></i>
                    <p style="font-weight: 600; font-size: 14px;">Waiting for a session to start...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // PROMPT & IMPORT LOGIC
        window.copiarPrompt = function(event) {
            const inputTitulo = document.getElementById('titulo-gram');
            const titulo = inputTitulo.value.trim() || 'Grammar Rules';
            const btn = event.currentTarget;
            
            const prompt = "Crie uma atividade de gramática em inglês.\n\n" +
                           "Regras importantes:\n\n" +
                           "A atividade deve ter 10 questões.\n" +
                           "Não use números dentro das frases.\n" +
                           "Cada questão deve ter 3 alternativas (A, B, C).\n" +
                           "Uma das três alternativas deve ser claramente correta de acordo com a frase. As outras duas devem ser plausíveis, mas incorretas.\n" +
                           "A resposta correta deve ser exatamente uma das três alternativas (a, b ou c).\n" +
                           "Mostre as questões em texto normal.\n" +
                           "Coloque TODAS as questões juntas dentro de UM ÚNICO bloco de código para que seja possível copiar tudo com um clique.\n" +
                           "Inclua a numeração das questões.\n" +
                           "Após cada questão, escreva:\n" +
                           "correct answer: seguido APENAS pela letra (a, b ou c).\n\n" +
                           "Não escreva explicações.\n\n" +
                           "Tema da atividade: [" + titulo + "]\n\n" +
                           "Use apenas inglês ou espanhol. Não use português.";

            navigator.clipboard.writeText(prompt).then(() => {
                const originalHTML = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> COPIED!';
                btn.style.background = '#d1fae5';
                btn.style.color = '#059669';
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.style.background = '#e0e7ff';
                    btn.style.color = '#4f46e5';
                }, 2000);
            });
        };

        document.addEventListener('input', (e) => {
            if (e.target.id === 'titulo-gram') {
                const btnPrompt = document.getElementById('btn-prompt-gram');
                if (btnPrompt && e.target.value.trim() === "") {
                    btnPrompt.innerHTML = '<i class="fa-solid fa-copy"></i> COPY AI PROMPT';
                }
            }
        });

        window.processarImportacao = function() {
            const texto = document.getElementById('texto-importar').value;
            if(!texto.trim()) return;

            const textoLimpo = texto.replace(/\*/g, '');
            const partes = textoLimpo.split(/--- EXPLICAÇÃO ---/i);
            const corpoQuestoes = partes[0];

            const blocos = corpoQuestoes.split(/\n\s*(?=\d+[\)\.\-\s])|(?<=\n|^)\s*(?=\d+[\)\.\-\s])/).filter(b => b.trim().length > 5);

            for(let i=1; i<=10; i++) {
                if(document.getElementById(`q-${i}`)) document.getElementById(`q-${i}`).value = "";
                if(document.getElementById(`optA-${i}`)) document.getElementById(`optA-${i}`).value = "";
                if(document.getElementById(`optB-${i}`)) document.getElementById(`optB-${i}`).value = "";
                if(document.getElementById(`optC-${i}`)) document.getElementById(`optC-${i}`).value = "";
            }

            blocos.forEach((bloco, i) => {
                if(i >= 10) return;
                const num = i + 1;
                const linhas = bloco.split('\n').map(l => l.trim()).filter(l => l !== "");
                if (linhas.length < 2) return;

                let enunciado = linhas[0].replace(/^\d+[\)\.\-\s]+\s*/, '');
                const optA = linhas.find(l => l.toLowerCase().startsWith('a)'))?.replace(/^[a-zA-Z]\)\s*/, '') || "";
                const optB = linhas.find(l => l.toLowerCase().startsWith('b)'))?.replace(/^[a-zA-Z]\)\s*/, '') || "";
                const optC = linhas.find(l => l.toLowerCase().startsWith('c)'))?.replace(/^[a-zA-Z]\)\s*/, '') || "";
                
                let correta = "A";
                const linhaGabarito = linhas.find(l => l.toLowerCase().includes('correct answer') || l.toLowerCase().includes('respuesta correcta'));
                
                if (linhaGabarito) {
                    const matchLetra = linhaGabarito.match(/[:\s]+([abcABC])\s*$/);
                    if (matchLetra) {
                        correta = matchLetra[1].toUpperCase();
                    }
                }

                const elEnunc = document.getElementById(`q-${num}`);
                const elA = document.getElementById(`optA-${num}`);
                const elB = document.getElementById(`optB-${num}`);
                const elC = document.getElementById(`optC-${num}`);
                const elCorreta = document.getElementById(`ans-${num}`);

                if(elEnunc) elEnunc.value = enunciado;
                if(elA) elA.value = optA;
                if(elB) elB.value = optB;
                if(elC) elC.value = optC;
                if(elCorreta) elCorreta.value = correta;
            });

            document.getElementById('modal-import').style.display = 'none';
        };
    </script>

    <!-- FIREBASE LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoPCn9UisXYRJFKwxfPoe-5nIhPqOVXt0",
            authDomain: "atividadesonline-2621d.firebaseapp.com",
            projectId: "atividadesonline-2621d",
            storageBucket: "atividadesonline-2621d.firebasestorage.app",
            messagingSenderId: "935315229080",
            appId: "1:935315229080:web:a55e2a949a9096fb55c3ed"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ==========================================
        // SUBSTITUA PELO SEU LINK DO REPOSITÓRIO DO ALUNO:
        const urlBaseAluno = "https://SEU_GITHUB.github.io/SEU_REPO_ALUNO/";
        // ==========================================

        let unsubscribe = null;

        const containerForm = document.getElementById('formQuestoesContainer');
        for (let i = 1; i <= 10; i++) {
            containerForm.innerHTML += `
                <div class="question-form">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                        <h4 style="margin:0; color:#0f172a; font-weight: 800; font-size:16px;">Question ${i}</h4>
                        <div style="display:flex; align-items:center; gap: 8px;">
                            <span style="font-size: 11px; font-weight: 800; color: #8b5cf6; text-transform: uppercase;">CORRECT:</span>
                            <select id="ans-${i}" class="input-premium" style="width: auto; margin: 0; padding: 6px 12px; background: #f3e8ff; border-color: #d8b4fe; color: #6d28d9;" autocomplete="off">
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                            </select>
                        </div>
                    </div>
                    <input type="text" id="q-${i}" class="input-premium" placeholder="Sentence..." autocomplete="off">
                    
                    <div style="display:flex; gap:10px;">
                        <div style="flex:1; position:relative;">
                            <span style="position:absolute; left:12px; top:50%; transform:translateY(-50%); font-weight:800; color:#cbd5e1; font-size:12px;">A</span>
                            <input type="text" id="optA-${i}" class="input-premium" placeholder="Option" style="padding-left:35px; margin:0;" autocomplete="off">
                        </div>
                        <div style="flex:1; position:relative;">
                            <span style="position:absolute; left:12px; top:50%; transform:translateY(-50%); font-weight:800; color:#cbd5e1; font-size:12px;">B</span>
                            <input type="text" id="optB-${i}" class="input-premium" placeholder="Option" style="padding-left:35px; margin:0;" autocomplete="off">
                        </div>
                        <div style="flex:1; position:relative;">
                            <span style="position:absolute; left:12px; top:50%; transform:translateY(-50%); font-weight:800; color:#cbd5e1; font-size:12px;">C</span>
                            <input type="text" id="optC-${i}" class="input-premium" placeholder="Option" style="padding-left:35px; margin:0;" autocomplete="off">
                        </div>
                    </div>
                </div>
            `;
        }

        document.getElementById('btnGerarSessao').addEventListener('click', async () => {
            const btn = document.getElementById('btnGerarSessao');
            const tituloSessao = document.getElementById('titulo-gram').value.trim() || "Grammar Session";
            
            let questoesSalvas = [];
            let temQuestaoInvalida = false;

            for (let i = 1; i <= 10; i++) {
                const enunciado = document.getElementById(`q-${i}`).value.trim();
                const optA = document.getElementById(`optA-${i}`).value.trim();
                const optB = document.getElementById(`optB-${i}`).value.trim();
                const optC = document.getElementById(`optC-${i}`).value.trim();
                const answer = document.getElementById(`ans-${i}`).value;

                if (!enunciado || !optA || !optB || !optC) temQuestaoInvalida = true;

                questoesSalvas.push({ q: enunciado, opts: { A: optA, B: optB, C: optC }, answer: answer });
            }

            if (temQuestaoInvalida) {
                alert("Por favor, preencha todos os campos das 10 questões.");
                return;
            }

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> PUBLISHING...';
            btn.style.pointerEvents = 'none';

            try {
                const sessaoRef = await addDoc(collection(db, "sessoes_ativas"), {
                    titulo: tituloSessao,
                    dataCriacao: new Date(),
                    status: "aberta",
                    questoes: questoesSalvas
                });
                
                const sessaoAtualId = sessaoRef.id;
                const linkCompleto = `${urlBaseAluno}?id=${sessaoAtualId}`;
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(linkCompleto)}`;

                document.getElementById('qrImage').src = qrUrl;
                document.getElementById('sessaoIdDisplay').innerText = sessaoAtualId;
                document.getElementById('qrCodeDisplay').style.display = 'flex';
                document.getElementById('areaCriacaoQuestoes').style.display = 'none';
                
                iniciarMonitoramento(sessaoAtualId);

            } catch (e) {
                console.error("Erro ao gerar sessão:", e);
                alert("Falha ao criar sala.");
                btn.innerHTML = '<i class="fa-solid fa-rocket"></i> PUBLISH SESSION & GET QR CODE';
                btn.style.pointerEvents = 'auto';
            }
        });

        function iniciarMonitoramento(idSessao) {
            if (unsubscribe) unsubscribe();

            const q = query(collection(db, "grammar_activity"), where("sessaoId", "==", idSessao));
            
            unsubscribe = onSnapshot(q, (snapshot) => {
                let logados = 0;
                let entregues = 0;
                const rankingList = document.getElementById('rankingList');
                
                if (snapshot.empty) {
                    rankingList.innerHTML = `
                        <div style="text-align: center; color: #94a3b8; margin-top: 50px;">
                            <i class="fa-solid fa-satellite-dish" style="font-size: 40px; margin-bottom: 15px; opacity: 0.5;"></i>
                            <p style="font-weight: 600; font-size: 14px;">Waiting for students to join...</p>
                        </div>`;
                    document.getElementById('countLogados').innerText = 0;
                    document.getElementById('countEntregues').innerText = 0;
                    return;
                }

                rankingList.innerHTML = ''; 
                let alunos = [];
                snapshot.forEach((doc) => { alunos.push({ id: doc.id, ...doc.data() }); });
                alunos.sort((a, b) => b.score - a.score);

                alunos.forEach((data) => {
                    logados++;
                    const isEntregue = data.status === "entregue";
                    if (isEntregue) entregues++;

                    const baseClass = isEntregue ? "success" : "pending";
                    const statusText = isEntregue ? "Done" : "Working";
                    const scoreDisplay = isEntregue ? `${data.score}/10` : `-`;

                    rankingList.innerHTML += `
                        <div class="card-premium-list ${baseClass}">
                            <div style="flex: 1; overflow: hidden; padding-left: 10px;">
                                <h3 style="margin:0; color:#0f172a; font-size:14px; font-weight: 800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${data.name}</h3>
                            </div>
                            <div style="flex: 1; text-align:right;">
                                <span class="badge ${baseClass}" style="margin-right: 10px;">${statusText}</span>
                                <span style="font-size: 16px; font-weight: 800; color: #0f172a;">${scoreDisplay}</span>
                            </div>
                        </div>
                    `;
                });

                document.getElementById('countLogados').innerText = logados;
                document.getElementById('countEntregues').innerText = entregues;
            });
        }
    </script>
</body>
</html>
